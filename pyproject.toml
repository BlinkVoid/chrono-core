[project]
name = "chrono-core"
version = "0.1.0"
description = "Workspace-level project continuity, session handoff, and documentation management infrastructure"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["mcp>=1.0,<2"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
chrono = "chrono_core.cli:main"
chrono-mcp = "chrono_core.mcp_server:main"
# Transitional aliases for scripts and clients using the former product name.
continuity = "chrono_core.cli:main"
continuity-mcp = "chrono_core.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
