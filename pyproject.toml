[project]
name = "chrono-core"
dynamic = ["version"]
description = "Local-first project memory for humans and AI agents: session handoffs, resume context, and cross-project continuity over SQLite."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["mcp>=1.0,<2"]
authors = [{ name = "Chrono Core Maintainers" }]
keywords = ["mcp", "agent-memory", "session-handoff", "continuity", "sqlite", "fts5", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control",
]

[project.urls]
Homepage = "https://github.com/BlinkVoid/chrono-core"
Repository = "https://github.com/BlinkVoid/chrono-core"
Issues = "https://github.com/BlinkVoid/chrono-core/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "anyio>=4",
]

[project.scripts]
chrono = "chrono_core.cli:main"
chrono-mcp = "chrono_core.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/chrono_core/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
